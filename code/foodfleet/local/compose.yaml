# Generated by generate.py from the platform model. Infrastructure always starts; services by profile:
#   docker compose --profile checkout up        (browse | checkout | track | full)
# Service images are built from each service's repository with the shared Dockerfile (ADR-053), tagged :local.
name: foodfleet
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.13}
    environment:
      POSTGRES_PASSWORD: local-only
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      interval: 2s
      retries: 30
    mem_limit: 512m
  kafka:
    image: apache/kafka:4.3.1
    ports:
    - 9092:9092
    mem_limit: 768m
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  redis:
    image: redis:7.4
    ports:
    - 6379:6379
    mem_limit: 64m
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command:
    - start-dev
    - --import-realm
    ports:
    - 8180:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only
    volumes:
    - ./realm:/opt/keycloak/data/import:ro
    mem_limit: 768m
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
    - 3000:3000
    - 4317:4317
    - 4318:4318
    mem_limit: 1024m
  payment-provider-stub:
    image: wiremock/wiremock:3.13.1
    profiles:
    - checkout
    - full
    volumes:
    - ./stubs/payment-provider:/home/wiremock:ro
    mem_limit: 256m
  edge-gateway:
    image: foodfleet/edge-gateway:local
    profiles:
    - browse
    - checkout
    - full
    ports:
    - 8100:8080
    environment:
      SPRING_APPLICATION_NAME: edge-gateway
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:ActiveProcessorCount=1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/foodfleet
      SPRING_DATA_REDIS_HOST: redis
      SPRING_HTTP_SERVICECLIENT_CUSTOMERBFF_BASEURL: http://customer-bff:8080
      SPRING_HTTP_SERVICECLIENT_PARTNERBFF_BASEURL: http://partner-bff:8080
      SPRING_HTTP_SERVICECLIENT_RIDERBFF_BASEURL: http://rider-bff:8080
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    mem_limit: 384m
  customer-bff:
    image: foodfleet/customer-bff:local
    profiles:
    - browse
    - checkout
    - full
    ports:
    - 8101:8080
    environment:
      SPRING_APPLICATION_NAME: customer-bff
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:ActiveProcessorCount=1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/foodfleet
      SPRING_HTTP_SERVICECLIENT_MENUSERVICE_BASEURL: http://menu-service:8080
      SPRING_HTTP_SERVICECLIENT_ZONESERVICE_BASEURL: http://zone-service:8080
      SPRING_GRPC_CLIENT_CHANNEL_ETASERVICE_TARGET: static://eta-service:9090
      SPRING_HTTP_SERVICECLIENT_ORDERSERVICE_BASEURL: http://order-service:8080
    depends_on:
      kafka:
