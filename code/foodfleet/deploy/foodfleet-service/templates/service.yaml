apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- include "ff.labels" . | nindent 4 }}
spec:
  selector: {app: {{ .Values.name }}}
  ports:
    - {name: http, port: 80, targetPort: http}
    {{- if .Values.grpc }}
    - {name: grpc, port: 9090, targetPort: grpc, appProtocol: grpc}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels: {{- include "ff.labels" . | nindent 4 }}
