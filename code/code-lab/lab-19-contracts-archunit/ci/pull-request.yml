# menu-service's pull-request checks, as a GitHub Actions workflow (an example: not run for this lab).
# Each job is a fitness function from an ADR. All block the merge except the OpenAPI diff, which is for review.
name: pull-request
on: [pull_request]

jobs:
  build:                                   # unit, slice and architecture tests (ArchitectureTest runs with them)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: mvn -B verify                 # includes ProviderMenuServiceTest against the contracts below

  api-compatibility:                       # ADR-027, ADR-063: the diff is shown on the pull request for review; it
    runs-on: ubuntu-latest                 # flagged 2 harmless changes of 12 in chapter 63, so contracts are the gate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - run: git show origin/main:src/main/resources/openapi/menu-service.yaml > /tmp/base.yaml
      - uses: actions/setup-go@v6
        with: {go-version: stable}
      - run: >                             # oasdiff 1.34.0, the version chapter 63 checked
          go run github.com/oasdiff/oasdiff@v1.34.0 breaking --fail-on ERR
          /tmp/base.yaml src/main/resources/openapi/menu-service.yaml

  contracts:                               # every consumer's contract from the broker, verified against this change
    runs-on: ubuntu-latest
    needs: build
    env:
      PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: >
          mvn -B test -Dtest=ProviderMenuServiceTest -Dpactbroker.url=$PACT_BROKER_BASE_URL
          -Dpact.verifier.publishResults=true -Dpact.provider.version=${{ github.sha }}
          -Dpact.provider.branch=${{ github.head_ref }}

  deployable:                              # would this version break anything already in production?
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - run: >
          docker run --rm -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN pactfoundation/pact-cli@${{ vars.PACT_CLI_DIGEST }}   # pinned by digest
          pact-broker can-i-deploy --pacticipant menu-service --version ${{ github.sha }} --to-environment production
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

  platform-rules:                          # ADR-052 to ADR-070: the rendered chart against the platform's 20 rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: |
          mkdir -p rendered
          helm template menu-service deploy/foodfleet-service -f deploy/values/menu-service.yaml > rendered/menu-service.yaml
          python3 deploy/conformance.py rendered
