# Lab 16: menu-service's namespace in the mesh. mTLS is required for every workload in the namespace, and only the
# callers the platform model lists may call it (code/foodfleet/model/generated/policies, ADR-038, ADR-057).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: menu-service
spec:
  mtls:
    mode: STRICT                 # plaintext is refused: a pod outside the mesh can't call menu-service at all
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: menu-service
  namespace: menu-service
spec:
  selector:
    matchLabels:
      app: menu-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:            # identities from mTLS certificates, not IP addresses or headers
              - "cluster.local/ns/customer-bff/sa/customer-bff"
              - "cluster.local/ns/menus-mcp/sa/menus-mcp"
              - "cluster.local/ns/partner-bff/sa/partner-bff"
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["8081"]        # the Actuator, for Prometheus only (ADR-052)
