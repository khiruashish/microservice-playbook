# Generated by Sidecar.inbound(): menu-service's sidecar, admitting only the gateway's identity over mTLS.
admin: {address: {socket_address: {address: 0.0.0.0, port_value: 15000}}}
static_resources:
  listeners:
    - name: inbound
      address: {socket_address: {address: 0.0.0.0, port_value: 15006}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inbound
                route_config:
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes: [{match: {prefix: "/"}, route: {cluster: app, timeout: 10s}}]
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates: [{certificate_chain: {filename: /etc/mesh-certs/tls.crt}, private_key: {filename: /etc/mesh-certs/tls.key}}]
                validation_context:
                  trusted_ca: {filename: /etc/mesh-certs/ca.crt}
                  match_typed_subject_alt_names:
                  - {san_type: URI, matcher: {exact: "spiffe://foodfleet.local/ns/mesh/sa/gateway"}}
  clusters:
    - name: app
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: app
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 8080}}}}]}]
