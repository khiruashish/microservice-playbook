# Generated by Sidecar.outbound(): the caller's sidecar, as in the resilience experiment's last variant.
admin: {address: {socket_address: {address: 0.0.0.0, port_value: 15000}}}
static_resources:
  listeners:
    - name: outbound
      address: {socket_address: {address: 0.0.0.0, port_value: 15001}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: outbound
                route_config:
                  virtual_hosts:
                    - name: menu-service
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route:
                            cluster: menu-service
                            timeout: 10s
                            retry_policy:
                              retry_on: 5xx,connect-failure,reset
                              num_retries: 2
                              per_try_timeout: 0.500s
                              retry_host_predicate:
                                - name: envoy.retry_host_predicates.previous_hosts
                                  typed_config: {"@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate}
                              host_selection_retry_max_attempts: 5
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
    - name: menu-service
      type: STRICT_DNS
      dns_refresh_rate: 2s
      respect_dns_ttl: false
      lb_policy: ROUND_ROBIN
      connect_timeout: 1s
      load_assignment:
        cluster_name: menu-service
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: menu-headless.mesh.svc.cluster.local, port_value: 15006}}}}]}]
      outlier_detection:
        consecutive_5xx: 5
        interval: 2s
        base_ejection_time: 30s
        max_ejection_percent: 50
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificates: [{certificate_chain: {filename: /etc/mesh-certs/tls.crt}, private_key: {filename: /etc/mesh-certs/tls.key}}]
            validation_context:
              trusted_ca: {filename: /etc/mesh-certs/ca.crt}
              match_typed_subject_alt_names:
              - {san_type: URI, matcher: {exact: "spiffe://foodfleet.local/ns/mesh/sa/menu-service"}}
