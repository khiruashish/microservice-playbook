# kitchen-service with three sidecars, using native sidecar containers: init containers with
# restartPolicy: Always (Kubernetes 1.29+ on by default, stable since 1.33). They start before the
# app, keep running beside it, are restarted if they die, and stop only after the app has stopped,
# so the app never starts without its ambassador or loses its last log lines on shutdown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-service
  namespace: foodfleet
  labels:
    app.kubernetes.io/name: kitchen-service
    app.kubernetes.io/part-of: foodfleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kitchen-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kitchen-service
        app.kubernetes.io/part-of: foodfleet
      annotations:
        prometheus.io/scrape: "true"          # the adapter's port, not the app's
        prometheus.io/port: "9102"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Ambassador: the app calls http://localhost:15001; credentials, timeouts, retries and the
        # circuit breaker live here, owned by the platform team.
        - name: payment-ambassador
          image: ghcr.io/foodfleet/payment-ambassador:1.4.0
          restartPolicy: Always
          env:
            - name: LISTEN_PORT
              value: "15001"
            - name: UPSTREAM
              value: https://api.payments.example
            - name: PER_TRY_TIMEOUT_MS
              value: "400"
            - name: MAX_ATTEMPTS
              value: "3"
            - name: TOKEN_FILE
              value: /var/run/secrets/payment/token
          ports:
            - name: ambassador
              containerPort: 15001
          startupProbe:                       # the app container starts only after this passes
            httpGet:
              path: /__ambassador/health
              port: 15001
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: payment-token
              mountPath: /var/run/secrets/payment
              readOnly: true
        # Adapter: Prometheus scrapes :9102/metrics; the adapter translates the tablet gateway's /stats.
        - name: tablet-metrics-adapter
          image: ghcr.io/foodfleet/tablet-metrics-adapter:0.3.2
          restartPolicy: Always
          env:
            - name: LISTEN_PORT
              value: "9102"
            - name: LEGACY_STATS_URL
              value: http://tablet-gateway.restaurants.svc.cluster.local/stats
          ports:
            - name: metrics
              containerPort: 9102
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
        # Sidecar: ships the app's file logs from the shared volume; keeps its position on the volume.
        - name: log-shipper
          image: ghcr.io/foodfleet/log-shipper:2.0.1
          restartPolicy: Always
          args: ["--file=/var/log/app/kitchen-service.log", "--position=/var/log/app/.shipper.position"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
      containers:
        - name: kitchen-service
          image: ghcr.io/foodfleet/kitchen-service:3.12.0
          env:
            - name: PAYMENT_PROVIDER_URL      # the ambassador, not the provider
              value: http://localhost:15001
            - name: LOGGING_FILE_NAME
              value: /var/log/app/kitchen-service.log
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-logs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir: {}
        - name: payment-token
          secret:
            secretName: payment-provider-token
