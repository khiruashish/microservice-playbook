# FoodFleet's Prometheus (3.15.0): metrics arrive by remote write from the gateway collector (start Prometheus with
# --web.enable-remote-write-receiver); rules turn them into per-service RED series that dashboards and SLO alerts
# (chapter 51) read, so no dashboard has to aggregate raw histograms over every pod.
global:
  scrape_interval: 15s            # the default is 1 m: too coarse to see a 30-second incident
  evaluation_interval: 15s
  external_labels:
    cluster: ap-south-1-prod

rule_files:
  - foodfleet-red.rules.yml

scrape_configs:
  - job_name: otel-collector      # the collector's own health: queue sizes, refused and dropped data
    static_configs:
      - targets: ['otel-collector.observability.svc:8888']
