# OpenTelemetry Java agent 2.32.0 for services that can't use Spring Boot's own instrumentation (legacy, third-party).
#   java -javaagent:opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=agent.properties -jar app.jar
# service.name, service.version and service.instance.id come from the environment (OTEL_SERVICE_NAME,
# OTEL_RESOURCE_ATTRIBUTES), set by the deployment from the pod's labels.
otel.exporter.otlp.endpoint=http://otel-collector.observability.svc:4318
# every trace leaves the service; the gateway collector decides what is kept after seeing it whole
otel.traces.sampler=parentbased_always_on
# metrics every 15 s instead of the SDK's default of a minute
otel.metric.export.interval=15000
# the JVM command line (every -D flag) is a resource attribute by default; only *password* and *secret* are masked
otel.resource.disabled.keys=process.command_args,process.command_line,process.executable.path
# low-cardinality request context as span attributes (never user IDs or card numbers)
otel.instrumentation.http.server.capture-request-headers=x-tenant,x-payment-method
