# FoodFleet's public API is a JSON REST API: allow its methods (the CRS default is GET HEAD POST OPTIONS,
# so every PUT, PATCH and DELETE scores as a protocol violation) and only the content types it accepts.
SecAction \
    "id:900200,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"
SecAction \
    "id:900220,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:'tx.allowed_request_content_type=|application/json| |multipart/form-data|'"
