# Rule exclusions for FoodFleet's free-text fields: order notes, reviews, support messages, addresses, names.
# These fields are bound to typed DTOs, length-limited, stored with bind parameters and rendered with output
# encoding, so SQL- and shell-injection signatures in them are noise. XSS detection stays on everywhere.
# Each exclusion names the endpoint, the field and the rule family: never a blanket "turn off rule 942xxx".
SecRule REQUEST_FILENAME "@rx ^/api/(?:orders|reviews|addresses|users/me|support/tickets/[^/]+/messages|riders/me/deliveries/[^/]+/proof|partner/(?:menu/items/[^/]+|hours|support/messages))$" \
    "id:10100,phase:1,pass,t:none,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.note,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.text,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.line1,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.line2,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.name,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.description,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.note,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.text,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.description"
# search is free text by design; it goes to OpenSearch as a match query, never into SQL
SecRule REQUEST_FILENAME "@rx ^/api/(?:restaurants|menu|search)$" \
    "id:10110,phase:1,pass,t:none,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:filter"
