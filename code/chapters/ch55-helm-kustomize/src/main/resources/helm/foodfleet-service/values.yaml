# Defaults for every service and environment; per-environment files override only what differs.
name: menu-service
replicaCount: 2           # ignored when autoscaling.enabled: the HPA owns replicas
image:
  repository: docker.io/foodfleet/menu-service
  tag: ""                 # dev may use a tag
  digest: ""              # staging and prod: always a digest (sha256:...)
  pullPolicy: IfNotPresent
resources:
  requests: {cpu: 250m, memory: 384Mi}
  limits: {memory: 384Mi}
javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
config:
  discount: "10"
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
pdb:
  maxUnavailable: 1
podAnnotations: {}
extraEnv: []              # [{name: X, value: "y"}]
