apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: menu-prod
resources: [../../base, hpa.yaml]
images:
  - name: docker.io/foodfleet/menu-service
    digest: sha256:REPLACE_WITH_PROMOTED_DIGEST
patches:
  - target: {kind: Deployment, name: menu-service}
    patch: |-
      - {op: remove, path: /spec/replicas}
      - {op: replace, path: /spec/template/spec/containers/0/imagePullPolicy, value: Never}
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 500m, memory: 512Mi}, limits: {memory: 512Mi}}}
