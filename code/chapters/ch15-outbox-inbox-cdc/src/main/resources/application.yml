spring:
  application:
    name: ordering-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ordering}
    username: ${DATABASE_USER:ordering}
    password: ${DATABASE_PASSWORD:ordering}

foodfleet:
  outbox:
    poll-interval-ms: 500      # latency floor of the polling relay
    batch-size: 100
    retention-days: 7          # published rows are deleted after this
