apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  replicas: 6
  selector:
    matchLabels: {app.kubernetes.io/name: order-service}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        foodfleet.in/data-class: personal          # names, phone numbers, addresses
      annotations:
        foodfleet.in/region: ap-south-1
        foodfleet.in/retention-days: "1095"
    spec:
      containers:
        - name: app
          image: registry.foodfleet.in/orders/order-service@sha256:c312b8af4989a587fa0c36ba8e7679374744996228a88d095fc8b230bde38dea
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
