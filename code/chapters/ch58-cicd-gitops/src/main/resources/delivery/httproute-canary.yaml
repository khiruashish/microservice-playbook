# The canary's traffic split: the rollout controller changes only the two weights, step by step (10, 25, 50, 100),
# and sets the canary's back to 0 when the analysis fails.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: menu
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: kube-system, sectionName: web}
  hostnames: ["menu.foodfleet.local"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /menu}}]
      backendRefs:
        - {name: menu-stable, port: 80, weight: 100}
        - {name: menu-canary, port: 80, weight: 0}
