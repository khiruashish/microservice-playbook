apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: menu-service}
  template:
    metadata:
      labels: {app: menu-service}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: foodfleet/menu-service:ch58
          imagePullPolicy: Never
          env:
            - {name: VERSION, value: "1.4.0"}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 96Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 1}
