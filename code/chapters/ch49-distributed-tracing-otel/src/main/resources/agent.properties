# OpenTelemetry Java agent 2.32.0 for services that run it instead of Spring Boot's tracing.
otel.exporter.otlp.endpoint=http://otel-collector.observability.svc:4318
# follow the caller's decision; sample new traces at the edge only (the gateway sets its own ratio)
otel.traces.sampler=parentbased_always_on
# W3C trace context and baggage out; B3 accepted from older callers only where they still exist
otel.propagators=tracecontext,baggage
# Kafka: context in record headers (default true); consumers continue the producer's trace (receive telemetry off)
otel.instrumentation.kafka.producer-propagation.enabled=true
otel.instrumentation.common.messaging.experimental.receive-telemetry.enabled=false
