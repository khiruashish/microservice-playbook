# The golden path in FoodFleet's developer portal: Backstage's scaffolder renders templates/v2 (its skeleton, with
# Backstage's ${{ values.* }} in place of this chapter's {{...}}), publishes the repository and registers it in the catalog.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: foodfleet-java-service
  title: FoodFleet Java service
  description: A service on the golden path, with its deployment, catalog entry, API description and CI.
  tags: [java, recommended]
spec:
  owner: platform
  type: service
  parameters:
    - title: The service
      required: [name, team, description]
      properties:
        name: {title: Name, type: string, pattern: "^[a-z][a-z0-9-]{2,30}$"}
        team: {title: Owning team, type: string, ui:field: OwnerPicker, ui:options: {catalogFilter: {kind: Group}}}
        description: {title: What it does, type: string}
  steps:
    - id: fetch
      name: Render the skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          team: ${{ parameters.team }}
          description: ${{ parameters.description }}
    - id: publish
      name: Create the repository
      action: publish:github
      input:
        repoUrl: github.com?owner=foodfleet&repo=${{ parameters.name }}
    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
