name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: javac -d build/classes $(find src/main/java -name '*.java')
      - run: spectral lint openapi.json --ruleset https://platform.foodfleet.dev/spectral.yaml --fail-severity error
      - run: docker build -t foodfleet/{{name}}:${{ github.sha }} .
