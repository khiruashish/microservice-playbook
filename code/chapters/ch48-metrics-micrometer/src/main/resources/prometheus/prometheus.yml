# Prometheus 3.15.0 scraping every order-service pod's /actuator/prometheus through Kubernetes service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - foodfleet-signals.rules.yml

scrape_configs:
  - job_name: foodfleet-services
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [foodfleet]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: job                       # job = the service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    metric_relabel_configs:
      - source_labels: [__name__]                # long-task timers that slipped through: not needed for RED
        regex: ".*_active_seconds.*"
        action: drop
