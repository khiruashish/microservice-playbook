# spiffe-helper 0.12 sidecar: fetches the SVID and trust bundle from the agent's Workload API and rewrites the
# files on every rotation; Spring Boot's SSL bundle watches them (reload-on-update).
agent_address = "/run/spire/sockets/agent.sock"
cert_dir = "/run/spiffe"
daemon_mode = true
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "svid_bundle.pem"
