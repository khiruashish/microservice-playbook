# SPIRE Agent 1.15, one per node (DaemonSet). Attests itself with the projected service account token, then
# attests each workload by its Kubernetes namespace and service account.
agent {
    data_dir = "/run/spire/data"
    log_level = "INFO"
    server_address = "spire-server.spire.svc"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_bundle_path = "/run/spire/bundle/bundle.crt"
    trust_domain = "foodfleet.internal"
}

plugins {
    NodeAttestor "k8s_psat" {
        plugin_data {
            cluster = "foodfleet-prod-ap-south-1"
        }
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "k8s" {
        plugin_data {
            # verifies the kubelet's certificate with the cluster CA (the default); never skip_kubelet_verification
        }
    }
}
