# SPIRE Server 1.15 for FoodFleet (Kubernetes). Every workload SVID lives one hour and is rotated by the agent at
# half its lifetime; the signing CA lives a day. Keys stay in the KMS, never on disk.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "foodfleet.internal"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    ca_ttl = "24h"                       # default 24h
    default_x509_svid_ttl = "1h"         # default 1h
    default_jwt_svid_ttl = "5m"          # default 5m
    ca_subject {
        country = ["IN"]
        organization = ["FoodFleet"]
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            connection_string = "${SPIRE_DATASTORE_DSN}"
        }
    }

    NodeAttestor "k8s_psat" {
        plugin_data {
            clusters = {
                "foodfleet-prod-ap-south-1" = {
                    service_account_allow_list = ["spire:spire-agent"]
                }
            }
        }
    }

    KeyManager "aws_kms" {
        plugin_data {
            region = "ap-south-1"
            key_identifier_value = "foodfleet-spire-server"
        }
    }

    Notifier "k8sbundle" {
        plugin_data {
            namespace = "spire"
        }
    }
}
