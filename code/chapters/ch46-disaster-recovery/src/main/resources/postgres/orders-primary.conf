# orders-db (Tier 0) primary, ap-south-1 zone a. Measured in chapter 46: a synchronous standby costs one round trip to it
# per commit and loses nothing; in another zone that is about a millisecond, in another region tens of milliseconds.

# Zero loss inside the region: a commit returns when one of the two standbys in the other zones has it on disk.
# With both of them down, commits wait: losing two zones stops writes rather than risking loss.
synchronous_standby_names = 'ANY 1 (orders_zone_b, orders_zone_c)'
synchronous_commit = on

# The standby in the other region (ap-south-2, orders_dr) is asynchronous: its lag is the regional RPO.
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 2GB

# Every WAL segment also goes to object storage in the other region, for restores and new standbys.
archive_mode = on
archive_command = 'pgbackrest --stanza=orders archive-push %p'
archive_timeout = 60s
