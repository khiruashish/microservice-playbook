# orders-db standby in ap-south-2 (asynchronous). Promoted only by the regional failover runbook, after the primary
# region is fenced (its writers stopped and its DNS withdrawn), never by an automatic health check across regions.
primary_conninfo = 'host=orders-db.ap-south-1.internal port=5432 user=replicator application_name=orders_dr sslmode=verify-full'
primary_slot_name = 'orders_dr'
hot_standby = on
restore_command = 'pgbackrest --stanza=orders archive-get %f "%p"'
recovery_target_timeline = 'latest'
