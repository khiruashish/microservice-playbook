spring:
  application:
    name: customer-profile
  threads:
    virtual:
      enabled: true
app:
  datasource:
    primary:
      url: ${PRIMARY_URL:jdbc:postgresql://localhost:5432/customers}
      username: ${DATABASE_USER:customers}
      password: ${DATABASE_PASSWORD:customers}
    replica:
      url: ${REPLICA_URL:jdbc:postgresql://localhost:5433/customers}
      username: ${DATABASE_USER:customers}
      password: ${DATABASE_PASSWORD:customers}
  reads:
    max-wait: 50ms          # how long a read waits for the replica to catch up before asking the primary
