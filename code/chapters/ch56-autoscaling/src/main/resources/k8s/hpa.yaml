# Target 50% of the request: each pod is expected to run at about half its request, leaving room for a spike
# while new pods start. behavior: is optional; these are Kubernetes' defaults, written out.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: menu-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: menu-service}
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Pods, value: 4, periodSeconds: 15}
        - {type: Percent, value: 100, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
