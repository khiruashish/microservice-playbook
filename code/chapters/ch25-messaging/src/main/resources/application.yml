spring:
  application:
    name: order-events-consumers
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                                    # the DLT publish waits for all in-sync replicas
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false                    # the container commits after processing
      isolation-level: read_committed              # skip records from aborted producer transactions
      max-poll-records: 100                        # also the most a crash can redeliver (ack-mode batch)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that can't be deserialised becomes an error the handler sends to the DLT,
      # instead of failing the poll forever (a classic poison message).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: dev.foodfleet.ch25.kafka.OrderEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.foodfleet.ch25.kafka
    listener:
      ack-mode: batch                              # the default: commit after each poll's records are processed
      observation-enabled: true
