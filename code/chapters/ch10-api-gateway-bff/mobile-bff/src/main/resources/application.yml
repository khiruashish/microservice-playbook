spring:
  application:
    name: mobile-bff
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null      # absent parts are left out: smaller payloads on mobile
  http:
    serviceclient:
      ordering:
        base-url: ${ORDERING_SERVICE_URL:http://localhost:8086}
        connect-timeout: 200ms
        read-timeout: 500ms
      eta:
        base-url: ${ETA_SERVICE_URL:http://localhost:8088}
        connect-timeout: 200ms
        read-timeout: 500ms
        apiversion:
          default: 2.0                         # the BFF always asks eta-service for v2 (chapter 8)
          insert:
            header: API-Version
      catalog:
        base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
        connect-timeout: 200ms
        read-timeout: 400ms
      dispatch:
        base-url: ${DISPATCH_SERVICE_URL:http://localhost:8092}
        connect-timeout: 200ms
        read-timeout: 400ms

server:
  port: ${PORT:8090}
  shutdown: graceful
  compression:
    enabled: true                              # gzip JSON for mobile networks
    mime-types: application/json,application/problem+json
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
