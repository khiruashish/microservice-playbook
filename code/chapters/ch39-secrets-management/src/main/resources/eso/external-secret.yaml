# The payment gateway API key, synced from OpenBao into a Kubernetes Secret for payment-service.
# refreshInterval defaults to 1h: a rotation in OpenBao reaches the Secret up to an hour later, then the kubelet
# updates mounted files (eventually), and environment variables never change until the pod restarts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-gateway
  namespace: payments
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: payment-gateway
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: payment-service/gateway
        property: apiKey
