# External Secrets Operator 2.12: one store for the cluster, reading OpenBao/Vault KV v2 with the operator's own
# Kubernetes identity. Teams then sync only the paths their namespace's ExternalSecrets name.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.platform.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
