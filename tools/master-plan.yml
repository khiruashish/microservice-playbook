# ---------------------------------------------------------------------------
# Microservices Enterprise Handbook — MASTER PLAN (single source of truth)
#
# Every page in the site is listed here exactly once. `tools/handbook.py`:
#   * creates a stub for any page that does not exist yet,
#   * regenerates the `nav:` block inside mkdocs.yml,
#   * regenerates docs/appendix/roadmap.md (progress tracker).
#
# Fields: id · file (relative to the section dir) · title · bands · scope
# bands: 1=L1 Foundation (0–3y) · 2=L2 Practitioner (3–7y)
#        3=L3 Senior/Lead (7–11y) · 4=L4 Architect/Principal (11–15+y)
# ---------------------------------------------------------------------------

