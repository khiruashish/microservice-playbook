# Builds the handbook site and the Java code on every push/PR.
# NOTE: GitHub only runs workflows from the repository root's .github/workflows.
# In the microservice-playbook repository the handbook is the root (HANDBOOK_DIR: .).
# If it lives inside a larger repo, copy this file to that repo's root and set
# HANDBOOK_DIR to the folder, e.g. architecture/microservices/microservice-playbook.
name: handbook

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HANDBOOK_DIR: .

jobs:
  code:
    name: Compile & test code (JDK 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.HANDBOOK_DIR }}/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B -ntp verify

  docs:
    name: Build site (strict)
    runs-on: ubuntu-latest
    needs: code
    defaults:
      run:
        working-directory: ${{ env.HANDBOOK_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-revision-date plugin needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/handbook.py --check
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ env.HANDBOOK_DIR }}/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
