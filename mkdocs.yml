site_name: Microservices Enterprise Handbook
site_description: >-
  Beginner to architect: microservices with Java 25 and Spring Boot 4 — patterns,
  components and tools, a real-time food delivery platform, and interview preparation.
site_author: Ashish
copyright: Copyright &copy; 2026 Ashish · Microservices Enterprise Handbook

site_url: https://khiruashish.github.io/microservice-playbook/
repo_url: https://github.com/khiruashish/microservice-playbook
repo_name: khiruashish/microservice-playbook
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/note-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-circle-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      # Paths are relative to the directory you run `mkdocs` from (this folder),
      # so code is included with: --8<-- "code/chapters/.../File.java"
      base_path: [".", "docs/includes"]
      check_paths: true
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - tags
  - glightbox:
      zoomable: true
      skip_classes: [no-lightbox]
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: date
  - minify:
      minify_html: true
  # Optional: social cards (needs Cairo/Pillow system libraries).
  # - social
  # Optional: offline build for air-gapped reading.
  # - offline

extra:
  generator: false
  status:
    new: Recently added
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
      name: Source repository (set your URL)
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/
      name: LinkedIn (set your URL)
  # Version selector (enable when publishing with `mike`).
  # version:
  #   provider: mike
  # Analytics placeholder.
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
  # Cookie consent placeholder.
  # consent:
  #   title: Cookie consent
  #   description: We use cookies to measure how the handbook is used.

exclude_docs: |
  includes/

